apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: csi-driver-nfs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kubernetes-csi.github.io/csi-driver-nfs
      chart: csi-driver-nfs
      targetRevision: 4.13.6
      helm:
        releaseName: csi-driver-nfs
    - repoURL: https://github.com/PMW9905/home-cluster.git
      targetRevision: main
      path: manifests/csi-driver-nfs
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
