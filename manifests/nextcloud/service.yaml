# Nextcloud runs on TrueNAS, outside the cluster. Traefik must have
# providers.kubernetesCRD.allowExternalNameServices enabled to use this.
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-external
  namespace: nextcloud
spec:
  type: ExternalName
  externalName: truenas.parkiki.org
  ports:
    - name: http
      port: 30027
