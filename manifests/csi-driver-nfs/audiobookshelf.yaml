---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: audiobookshelf-config-storageclass
provisioner: nfs.csi.k8s.io
parameters:
  server: truenas.parkiki.org
  share: /mnt/fast_storage/k3s
  subDir: audiobookshelf-config
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - hard
  - nfsvers=4.1
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: audiobookshelf-metadata-storageclass
provisioner: nfs.csi.k8s.io
parameters:
  server: truenas.parkiki.org
  share: /mnt/fast_storage/k3s
  subDir: audiobookshelf-metadata
reclaimPolicy: Retain
volumeBindingMode: Immediate
mountOptions:
  - hard
  - nfsvers=4.1
